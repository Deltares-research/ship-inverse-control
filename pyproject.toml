[project]
name = "ship-inverse-control"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "bokeh>=3.1.0",
    "dask-geopandas>=0.5.0",
    "dask[distributed]>=2026.8.0",
    "geopandas>=1.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "movingpandas>=0.23.0",
    "netcdf4>=1.7.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyrsistent>=0.20.0",
    "python-vehicle-simulator",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "stonesoup>=1.9.1",
    "tqdm>=4.70.1",
    "xarray>=2026.9.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ship_inverse_control"

[tool.uv.sources]
python-vehicle-simulator = { git = "https://github.com/Deltares-research/PythonVehicleSimulator" }
